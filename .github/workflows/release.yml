name: Release

# Builds installers for Windows (setup .exe + .msi), macOS (.dmg) and Linux (.deb, .AppImage, .rpm)
# and attaches them to the GitHub Release "v<version>" (created if missing).
# Runs when the app version changes on main, on a version tag, or manually.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/tauri.conf.json"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Kasa v__VERSION__"
          releaseBody: |
            Kurulum dosyaları:
            - Windows: `Kasa_x.y.z_x64-setup.exe` (önerilen) veya `.msi`
            - macOS: Apple Silicon için `aarch64.dmg`, Intel için `x64.dmg`
            - Linux: `.deb`, `.AppImage` veya `.rpm`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
